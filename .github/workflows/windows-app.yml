# Builds the portable Windows package: our window (WebView2) + Node + server + web + lessons.
# Needed because the desktop cannot be built or run in the Linux cloud container (CLAUDE.md §9.8).
name: Windows app

on:
  push:
    branches: ['claude/**']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'content/**'
      - 'tools/package-windows.ps1'
      - 'tools/*.mjs'
      - 'tools/installer/**'
      - '.github/workflows/windows-app.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    env:
      # One number for Sinf.exe, the updater and both installers (B6): the updater compares it.
      SINF_VERSION: 0.3.${{ github.run_number }}
      # Public half of the update key (GitHub → Settings → Variables), built into the updater;
      # empty — the build works, and its updater says updates are off (ADR-023).
      SINF_UPDATE_PUBLIC_KEY: ${{ vars.SINF_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # better-sqlite3 is native: this is the step that cannot happen on Linux.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Tests of the Windows-free logic (xUnit, ADR-014)
        run: dotnet test apps/desktop-core.Tests

      - name: Our window (self-contained, .NET not required on the school PC)
        run: >
          dotnet publish apps/desktop/Sinf.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.SINF_VERSION }}

      - name: The agent (B7; one trimmed file, switched on only when asked)
        run: dotnet publish apps/agent/Sinf.Agent.csproj -c Release -r win-x64 -p:Version=${{ env.SINF_VERSION }}

      - name: The updater (B6; one trimmed file with the update key built in)
        shell: pwsh
        run: |
          dotnet publish apps/updater/Sinf.Updater.csproj -c Release -r win-x64 `
            "-p:Version=$env:SINF_VERSION" "-p:UpdatePublicKey=$env:SINF_UPDATE_PUBLIC_KEY"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish: код $LASTEXITCODE" }
          if (-not $env:SINF_UPDATE_PUBLIC_KEY) { Write-Host '::warning::SINF_UPDATE_PUBLIC_KEY не задан: в этой сборке автообновление выключено' }

      - name: Collect the package (server deploy included)
        shell: pwsh
        # The package carries the agent's own Node version, the one the smoke test then runs against.
        run: ./tools/package-windows.ps1 -NodeVersion (& node --version).TrimStart('v')

      # Proves the server really runs on Windows, from the packaged folder, before anyone downloads it.
      - name: Smoke test of the packaged server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $node = Join-Path $root 'out/Sinf/server/node.exe'
          $entry = Join-Path $root 'out/Sinf/server/dist/index.js'
          $smoke = Join-Path $root 'out/smoke'
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Write-Host "node.exe: $(& $node --version)"
          Write-Host "точка входа на месте: $(Test-Path $entry)"

          # The native module first: it is the only compiled code in the server, so a silent crash
          # (exit code 0xC0000005) points here before anything else.
          # The native module first: it is the only compiled code in the server, and an old Node cannot
          # load its prebuilt binary (Node 22.12 crashes with 0xC0000005, 22.23 is fine).
          Push-Location (Join-Path $root 'out/Sinf/server')
          & $node -e "const D = require('better-sqlite3'); const db = new D(':memory:'); console.log('better-sqlite3 ok:', db.prepare('select 1 as x').get().x);"
          $sqliteCode = $LASTEXITCODE
          Pop-Location
          if ($sqliteCode -ne 0) { throw "better-sqlite3 не загрузился, код $sqliteCode" }

          $env:NODE_ENV = 'production'
          $env:PORT = '3123'
          $env:HOST = '127.0.0.1'
          $env:DATA_DIR = $smoke
          $env:DATABASE_PATH = Join-Path $smoke 'sinf.db'
          $env:CONTENT_DIR = Join-Path $root 'out/Sinf/content'
          $env:WEB_DIR = Join-Path $root 'out/Sinf/web'
          $env:SESSION_SECRET = 'smoke-test-secret-not-a-real-one'
          $env:DEMO_TEACHER_PASSWORD = 'smoke-test'

          $outLog = Join-Path $smoke 'out.log'
          $errLog = Join-Path $smoke 'err.log'
          $server = Start-Process -FilePath $node -ArgumentList $entry -WorkingDirectory $root `
            -PassThru -NoNewWindow -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          try {
            $ready = $false
            foreach ($try in 1..40) {
              Start-Sleep -Milliseconds 500
              if ($server.HasExited) { break }
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:3123/health' -TimeoutSec 2
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) {
              Write-Host "процесс завершился: $($server.HasExited)"
              if ($server.HasExited) { Write-Host "код выхода: $($server.ExitCode)" }
              foreach ($log in @($outLog, $errLog)) {
                Write-Host "--- $log"
                if (Test-Path $log) { Get-Content $log -Raw } else { Write-Host '(файла нет)' }
              }
              throw 'Сервер не ответил на /health'
            }
            $courses = Invoke-RestMethod 'http://127.0.0.1:3123/api/courses' -TimeoutSec 5
            $lessons = ($courses.courses | ForEach-Object { $_.lessons.Count } | Measure-Object -Sum).Sum
            Write-Host "/health: ok, уроков отдано: $lessons"
            if ($lessons -lt 1) { throw 'Сервер не отдал ни одного урока' }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      # The installer carries the WebView2 offline installer (CLAUDE.md §3.2): only Microsoft's
      # signed standalone file, never the small online bootstrapper.
      - name: WebView2 offline installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'tools/installer/redist'
          $file = Join-Path $dir 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $file
          $size = (Get-Item $file).Length
          $sig = Get-AuthenticodeSignature $file
          Write-Host ("WebView2: {0:N1} МБ, подпись: {1}, {2}" -f ($size / 1MB), $sig.Status, $sig.SignerCertificate.Subject)
          if ($size -lt 50MB) { throw 'Это не офлайн-установщик WebView2' }
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'Подпись установщика WebView2 не Microsoft'
          }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /Qp "/DAppVersion=$env:SINF_VERSION" tools/installer/sinf.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: код $LASTEXITCODE" }
          # The update (B6): the same program without the WebView2 installer inside.
          & $iscc /Qp "/DAppVersion=$env:SINF_VERSION" /DUpdateBuild tools/installer/sinf.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC (обновление): код $LASTEXITCODE" }
          Get-ChildItem out/installer | Select-Object Name, @{ Name = 'МБ'; Expression = { '{0:N1}' -f ($_.Length / 1MB) } } | Format-Table -AutoSize

      # Installed, reinstalled as the teacher's and removed on the runner, silently, as on a school PC.
      - name: Silent install, reinstall, update over it and removal
        shell: pwsh
        run: ./tools/installer/smoke.ps1

      # B6: an older install, a newer signed update on the classroom server, a lesson to wait out,
      # then the update itself — with a throwaway key, never the project's.
      - name: Update from start to end (test key)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path out/update-smoke | Out-Null
          node tools/update-key.mjs | Out-File -Encoding utf8 out/update-smoke/test-key.txt
          $public = (Get-Content out/update-smoke/test-key.txt)[4].Trim()
          dotnet publish apps/updater/Sinf.Updater.csproj -c Release -r win-x64 `
            "-p:Version=$env:SINF_VERSION" "-p:UpdatePublicKey=$public" -o out/test-updater
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish: код $LASTEXITCODE" }
          ./tools/installer/update-smoke.ps1 -Version $env:SINF_VERSION `
            -TestUpdater out/test-updater/Sinf.Updater.exe -KeyFile out/update-smoke/test-key.txt

      # B7: the agent switched on by the installer and off by removing Sinf; the computer as before.
      - name: The agent on and off
        shell: pwsh
        run: ./tools/installer/agent-smoke.ps1

      # The update for the platform's /admin: signed with the project's key, only where CI has it.
      - name: Sign the update
        shell: pwsh
        env:
          SINF_UPDATE_KEY: ${{ secrets.SINF_UPDATE_KEY }}
        run: |
          if (-not $env:SINF_UPDATE_KEY) {
            Write-Host '::warning::SINF_UPDATE_KEY не задан: обновление не подписано, артефакта Sinf-update-x64 нет (docs/pc-test.md)'
            exit 0
          }
          node tools/sign-update.mjs "out/installer/Sinf-update-$env:SINF_VERSION.exe" $env:SINF_VERSION out/update
          if ($LASTEXITCODE -ne 0) { throw "подпись: код $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-logs
          path: out/installer-logs
          if-no-files-found: ignore

      # Top level only: a full listing is thousands of lines of node_modules.
      - name: Package contents
        shell: pwsh
        run: |
          $files = Get-ChildItem out/Sinf -Recurse -File
          Write-Host ("всего файлов: {0}, размер: {1:N1} МБ" -f $files.Count, (($files | Measure-Object -Property Length -Sum).Sum / 1MB))
          Get-ChildItem out/Sinf | Select-Object Name, @{ Name = 'МБ'; Expression = {
            if ($_.PSIsContainer) {
              '{0:N1}' -f ((Get-ChildItem $_.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB)
            } else {
              '{0:N1}' -f ($_.Length / 1MB)
            }
          } } | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: Sinf-windows-x64
          path: out/Sinf
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Sinf-setup-x64
          path: out/installer/Sinf-setup-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Sinf-update-x64
          path: out/update
          if-no-files-found: ignore
